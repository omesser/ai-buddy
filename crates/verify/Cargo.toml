[package]
name = "ai-buddy-verify"
description = "Agent/CI verify entry: doctor, units, overlay, cleanup (ADR-0027 stone 0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ai-buddy-verify"
path = "src/main.rs"

[dependencies]
clap = {version = "4", features = ["derive"]}

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Pure Rust today, and nothing about what this crate does needs FFI. `forbid`
# rather than `deny` so the guarantee cannot be turned off one `#[allow]` at a
# time: adding `unsafe` here should be a conversation, not a local override.
unsafe_code = "forbid"
