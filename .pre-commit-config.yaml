# Run `pre-commit install` once after cloning.
#
# The Rust hooks at the bottom are local rather than pulled from a hook repo:
# this crate's manifest lives in src-tauri/, not at the root, and the published
# Rust hooks all assume a root Cargo.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    # Git style
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules

    # Common errors
      - id: end-of-file-fixer
        exclude: ^(.*\.b64|branding/_b64/parts/.*)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-toml
        exclude: ^Cargo\.lock$
      - id: check-executables-have-shebangs

    # Cross platform
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

    # Security
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        # "crate" is Rust vocabulary, not a misspelling of "create".
        # "static" is Win32 control class vocabulary (STATIC); codespell flags STATICs/Statics as "statistics".
        args: ["--ignore-words-list=crate,crates,static,statics"]
        exclude: ^(Cargo\.lock|.*\.png|.*\.b64|branding/_b64/parts/.*)$

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --no-sort]
        exclude: ^Cargo\.lock$
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', '--offset', '2', --preserve-quotes]

    # Shell formatting and check
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ['-l', '-i', '2', '-ci', '-sr', '-w']
      - id: shellcheck

    # PowerShell linting
  - repo: local
    hooks:
      - id: psscriptanalyzer-check
        name: PSScriptAnalyzer
        # Runs when pwsh is available; skips cleanly otherwise.
        entry: scripts/hooks/psscriptanalyzer.sh
        language: system
        files: \.ps1$
        # Severity Error: only fail on actual errors, not style warnings.
        # Keeps PSUseBOMForUnicodeEncodedFile active (default in PSScriptAnalyzer)
        # to catch encoding issues like the #392 em-dash footgun.

    # Swift (macOS only; skipped on Linux CI)
  - repo: local
    hooks:
      - id: swiftc-typecheck
        name: swiftc typecheck (macOS only)
        # One file at a time: top-level code is only legal in a single-file
        # compilation, and these are scripts, not a module.
        #
        # swiftc ships with Xcode, so this genuinely cannot run elsewhere —
        # unlike the clippy split above, no restructuring makes it portable.
        entry: bash -c 'if [ "$(uname -s)" != Darwin ]; then echo "skipped - swiftc ships with Xcode"; exit 0; fi; for f in "$@"; do swiftc -typecheck "$f" || exit 1; done' --
        language: system
        types: [swift]

    # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        args: [--check]
        language: system
        types: [rust]
        pass_filenames: false

      # One hook per crate, so a failure names the crate it came from.
      - id: cargo-clippy-core
        name: cargo clippy (core)
        entry: cargo clippy -p ai-buddy-core --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false

      # An ADR's number is how one decision cites another — `docs/agents/domain.md`
      # asks for "Contradicts ADR-0007", and source comments cite bare numbers
      # too. Two files sharing one made that string ambiguous twice before
      # anyone noticed, both times because two branches picked the next number
      # in parallel. #354.
      - id: adr-numbers-unique
        name: ADR numbers are unique
        entry: bash -c 'twice=$(ls docs/adr | grep -oE "^[0-9]{4}" | sort | uniq -d); if [ -n "$twice" ]; then echo "ADR number used more than once - $twice"; exit 1; fi' --
        language: system
        files: ^docs/adr/
        pass_filenames: false

      - id: cargo-clippy-mcp-server
        name: cargo clippy (mcp-server)
        entry: cargo clippy -p ai-buddy-mcp-server --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false

      # Ungated, and that is the point: the shell builds on Linux too — the
      # Tauri headers go in beside it in tests.yml — and while this hook
      # skipped itself off Darwin, nothing denied warnings over
      # `platform/x11/` or any `target_os = "linux"` arm. The Windows job
      # denies them and never compiles those arms; Ubuntu compiled them under
      # `cargo test`, which does not fail on a warning. #321.
      #
      # A machine whose window layer the shell cannot link now fails here
      # instead of printing "skipped". That is the honest answer: the error
      # names the missing library, where a skip claimed the crate had been
      # checked.
      - id: cargo-clippy-shell
        name: cargo clippy (shell)
        entry: cargo clippy -p ai-buddy --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false
