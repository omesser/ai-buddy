# Run `pre-commit install` once after cloning.
#
# The Rust hooks at the bottom are local rather than pulled from a hook repo:
# this crate's manifest lives in src-tauri/, not at the root, and the published
# Rust hooks all assume a root Cargo.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    # Git style
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules

    # Common errors
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-toml
        exclude: ^Cargo\.lock$
      - id: check-executables-have-shebangs

    # Cross platform
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

    # Security
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        # "crate" is Rust vocabulary, not a misspelling of "create".
        args: ["--ignore-words-list=crate,crates"]
        exclude: ^(Cargo\.lock|.*\.png)$

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --no-sort]
        exclude: ^Cargo\.lock$
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', '--offset', '2', --preserve-quotes]

    # Shell formatting and check
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ['-l', '-i', '2', '-ci', '-sr', '-w']
      - id: shellcheck

    # Swift (macOS only; skipped on Linux CI)
  - repo: local
    hooks:
      - id: swiftc-typecheck
        name: swiftc typecheck
        # One file at a time: top-level code is only legal in a single-file
        # compilation, and these are scripts, not a module.
        entry: bash -c 'for f in "$@"; do swiftc -typecheck "$f" || exit 1; done' --
        language: system
        types: [swift]

    # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        args: [--check]
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false
