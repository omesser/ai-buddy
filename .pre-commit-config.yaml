# Run `pre-commit install` once after cloning.
#
# The Rust hooks at the bottom are local rather than pulled from a hook repo:
# this crate's manifest lives in src-tauri/, not at the root, and the published
# Rust hooks all assume a root Cargo.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    # Git style
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules

    # Common errors
      - id: end-of-file-fixer
        exclude: ^(.*\.b64|branding/_b64/parts/.*)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-toml
        exclude: ^Cargo\.lock$
      - id: check-executables-have-shebangs

    # Cross platform
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

    # Security
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        # "crate" is Rust vocabulary, not a misspelling of "create".
        # "static" is Win32 control class vocabulary (STATIC); codespell flags STATICs/Statics as "statistics".
        args: ["--ignore-words-list=crate,crates,static,statics"]
        exclude: ^(Cargo\.lock|.*\.png|.*\.b64|branding/_b64/parts/.*)$

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --no-sort]
        exclude: ^Cargo\.lock$
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', '--offset', '2', --preserve-quotes]

    # Shell formatting and check
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ['-l', '-i', '2', '-ci', '-sr', '-w']
      - id: shellcheck

    # PowerShell linting
  - repo: local
    hooks:
      - id: psscriptanalyzer-check
        name: PSScriptAnalyzer
        # Runs when pwsh is available; skips cleanly otherwise.
        entry: scripts/hooks/psscriptanalyzer.sh
        language: system
        files: \.ps1$
        # A syntax fault is graded ParseError, not Error, so `Error` alone
        # passed a .ps1 that does not parse. #493. Encoding is a Warning and
        # stays out — the hook below holds that policy.

      # Separate from the analyzer because it cannot hold this policy: its
      # non-ASCII rule prescribes adding a BOM, and a BOM is itself three
      # non-ASCII bytes. #392, #418.
      - id: powershell-ascii-only
        name: PowerShell scripts are ASCII-only
        language: pygrep
        entry: '[^\x00-\x7F]'
        # Case-insensitive: Windows does not distinguish `.PS1`.
        files: (?i)\.ps1$

    # Swift (macOS only; skipped on Linux CI)
  - repo: local
    hooks:
      - id: swiftc-typecheck
        name: swiftc typecheck (macOS only)
        # One file at a time: top-level code is only legal in a single-file
        # compilation, and these are scripts, not a module.
        #
        # swiftc ships with Xcode, so this genuinely cannot run elsewhere —
        # unlike the clippy split above, no restructuring makes it portable.
        entry: bash -c 'if [ "$(uname -s)" != Darwin ]; then echo "skipped - swiftc ships with Xcode"; exit 0; fi; for f in "$@"; do swiftc -typecheck "$f" || exit 1; done' --
        language: system
        types: [swift]

    # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        args: [--check]
        language: system
        types: [rust]
        pass_filenames: false

      # An ADR's number is how one decision cites another — `docs/agents/domain.md`
      # asks for "Contradicts ADR-0007", and source comments cite bare numbers
      # too. Two files sharing one made that string ambiguous twice before
      # anyone noticed, both times because two branches picked the next number
      # in parallel. #354.
      - id: adr-numbers-unique
        name: ADR numbers are unique
        entry: bash -c 'twice=$(ls docs/adr | grep -oE "^[0-9]{4}" | sort | uniq -d); if [ -n "$twice" ]; then echo "ADR number used more than once - $twice"; exit 1; fi' --
        language: system
        files: ^docs/adr/
        pass_filenames: false

      # One workspace clippy — same shape as the Windows CI job. A single
      # invocation is harder to forget a new member on, and cargo names the
      # crate in diagnostics. Split per-package hooks used to exist so a
      # failure named the crate in the pre-commit UI; that tax grew with every
      # member (core / mcp-server / verify / shell) and a docs-only SKIP list.
      #
      # Still ungated for the shell on purpose (#321): workspace clippy must
      # link `ai-buddy` on this machine so `platform/x11` / linux arms get
      # `-D warnings`. A missing window-layer library fails here instead of a
      # skip claiming the crate was checked.
      - id: cargo-clippy
        name: cargo clippy (workspace)
        entry: cargo clippy --workspace --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false
