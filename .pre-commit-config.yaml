# Run `pre-commit install` once after cloning.
#
# The Rust hooks at the bottom are local rather than pulled from a hook repo:
# this crate's manifest lives in src-tauri/, not at the root, and the published
# Rust hooks all assume a root Cargo.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    # Git style
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules

    # Common errors
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-toml
        exclude: ^Cargo\.lock$
      - id: check-executables-have-shebangs

    # Cross platform
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

    # Security
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        # "crate" is Rust vocabulary, not a misspelling of "create".
        args: ["--ignore-words-list=crate,crates"]
        exclude: ^(Cargo\.lock|.*\.png)$

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --no-sort]
        exclude: ^Cargo\.lock$
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', '--offset', '2', --preserve-quotes]

    # Shell formatting and check
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ['-l', '-i', '2', '-ci', '-sr', '-w']
      - id: shellcheck

    # Swift (macOS only; skipped on Linux CI)
  - repo: local
    hooks:
      - id: swiftc-typecheck
        name: swiftc typecheck (macOS only)
        # One file at a time: top-level code is only legal in a single-file
        # compilation, and these are scripts, not a module.
        #
        # swiftc ships with Xcode, so this genuinely cannot run elsewhere —
        # unlike the clippy split above, no restructuring makes it portable.
        entry: bash -c 'if [ "$(uname -s)" != Darwin ]; then echo "skipped - swiftc ships with Xcode"; exit 0; fi; for f in "$@"; do swiftc -typecheck "$f" || exit 1; done' --
        language: system
        types: [swift]

    # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        args: [--check]
        language: system
        types: [rust]
        pass_filenames: false

      # Split by portability, not by taste. The core crate depends on no
      # platform binding, so it lints anywhere — including a Linux contributor's
      # laptop and the Linux CI job.
      - id: cargo-clippy-core
        name: cargo clippy (core)
        entry: cargo clippy -p ai-buddy-core --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy-mcp-server
        name: cargo clippy (mcp-server)
        entry: cargo clippy -p ai-buddy-mcp-server --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false

      # The shell is AppKit and Tauri, so it only compiles on macOS. The hook
      # says so itself rather than leaving CI to remember: pre-commit has no
      # platform key, and a SKIP list in a workflow puts that knowledge in the
      # wrong file.
      - id: cargo-clippy-shell
        name: cargo clippy (shell, macOS only)
        entry: bash -c 'if [ "$(uname -s)" != Darwin ]; then echo "skipped - the shell needs macOS"; exit 0; fi; exec cargo clippy -p ai-buddy --all-targets -- -D warnings' --
        language: system
        types: [rust]
        pass_filenames: false
