# What each Harness has been proved to do, and when.
#
# This file is one half of a row. The other half — the name and the command
# line — is not here: it is `launch()` in `src-tauri/src/harness.rs`, the table
# the app actually dispatches on. `scripts/make-harness-table.py` joins the two
# and writes the README's Harness Support section, and it fails when the two
# disagree, so a Harness cannot be added to one and forgotten in the other.
#
# A row moves when `scripts/probe-harness.sh` exits zero (ADR-0022). Record the
# date that run happened, not the date this file was edited. `unverified` is a
# legitimate answer and a more useful one than a guess.
#
# No cell may contain `|`; the generator refuses rather than emit a broken row.

[harness.claude]
standing = """
Zed's adapter over the Claude Agent SDK; no first-party ACP mode. \
**Verified 2026-09-07**: `end_turn` on a fresh session and again on a resumed one."""
fresh = "yes"
resumed = "yes"
load_session = "yes"
mcp = "http"
auth = "none advertised when signed in"

[harness.hermes]
standing = """
First-party. **Verified 2026-09-07**: `end_turn` on a fresh session, and on a \
resumed one once a failed first turn reopens the session it had only said it \
loaded (#448)."""
fresh = "yes"
resumed = "yes, after the reopen"
load_session = "yes"
mcp = "stdio"
auth = "two: custom runtime credentials, Configure Hermes provider"

[harness.opencode]
standing = """
First-party. **Unverified**: not installed on the machine either #433 or #434 \
was written on. #457 smokes it."""
fresh = "unverified"
resumed = "unverified"
load_session = "unverified"
mcp = "unverified"
auth = "unverified"

# Not a Harness but a row all the same: the arm `launch()` falls through to.
[escape_hatch]
label = "anything else"
command = "as typed, split on whitespace"
standing = """
Unnamed, unverified, and it works: any command that speaks ACP on stdio \
attaches. Grok Build (`grok agent stdio`), GitHub Copilot CLI \
(`copilot --acp --stdio`) and Gemini CLI (`gemini --acp`) reach ai-buddy this \
way today and earn a named row once a turn is smoked (#457)."""
fresh = "unverified"
resumed = "unverified"
load_session = "unverified"
mcp = "unverified"
auth = "unverified"
