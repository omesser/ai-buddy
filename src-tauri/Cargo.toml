[package]
name = "ai-buddy"
description = "A desktop companion that lives on your screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ai-buddy"
path = "src/main.rs"

[build-dependencies]
tauri-build = {version = "2", features = []}

[dependencies]
tauri = {version = "2", features = ["macos-private-api", "tray-icon"]}
# Launch at login, when there is a bundled app to start. The settings row
# is frozen until then: a Launch Agent on `cargo run` is not the product.
tauri-plugin-autostart = "2"
# Signed updates from GitHub Releases. WindowPet's updater shape, our endpoint.
tauri-plugin-updater = "2"
ai-buddy-core = {path = "../crates/core"}
serde = {version = "1", features = ["derive"]}
# Character Package art reaches the webview as `data:` URLs; `src/cast.rs` says
# why.
base64 = "0.23"
# Reading a Character Package that was shipped as an archive. Zip because it is
# what Finder's "Compress" produces, and a central-directory parser over
# untrusted input is not something to hand-roll. `deflate-flate2` rather than
# the umbrella `deflate` feature: it reuses the flate2 already here under `png`,
# where the umbrella also drags in zopfli, a compressor only a writer needs.
zip = {version = "8.6", default-features = false, features = ["deflate-flate2"]}
# The hotkey that hides and shows the Character. Tauri has no global shortcut
# of its own — this is its first-party plugin — and the alternative is an
# AppKit global event monitor, which needs Accessibility consent that DESIGN.md
# decision 9 refuses to ask for. Carbon's `RegisterEventHotKey` underneath
# prompts for nothing.
tauri-plugin-global-shortcut = "2"
# Sync HTTP for the model Director. A worker thread posts; the frame loop
# does not wait. ureq instead of reqwest: no tokio.
ureq = {version = "3", features = ["json"]}
serde_json = "1"
# The OS secret store is how the Director key survives `cargo run` without
# landing in `settings.json`.
keyring = {version = "3", features = ["apple-native", "windows-native", "sync-secret-service"]}
# PNG decoding for the tray icon.
image = {version = "0.25", default-features = false, features = ["png"]}

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# X11 for Linux: window list, pointer state, EWMH properties, idle time.
# x11rb is pure Rust, maintained, and wraps the protocol at a level that
# gives both raw access and type-safe helpers.
x11rb = {version = "0.14", features = ["allow-unsafe-code", "randr", "xfixes", "shape", "dpms", "screensaver"]}
# Raw window handle for getting the X11 window id from Tauri.
raw-window-handle = "0.6"
# Cast atom arrays to bytes for X11 property changes.
bytemuck = "1.16"
# GTK 3 for native Linux settings window. Tauri 2's WebKitGTK uses GTK 3,
# so this adds no second GTK major version.
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# The context menu (#155) is not here: `tauri::menu` already wraps the menu
# library Tauri ships with, so naming it again would put a second copy of it in
# the tree — and on Linux the copy is what dragged in libxdo.
objc2 = "0.6"
objc2-app-kit = {version = "0.3", features = [
  "NSWindow",
  "NSPanel",
  "NSResponder",
  "NSApplication",
  # Which application the user is in. Reports the application only — no window,
  # no title — so nothing here is gated by Screen Recording.
  "NSWorkspace",
  "NSRunningApplication",
  # Native settings window. SPEC gives the webview to the sprite and chat, not
  # to checkboxes.
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSControl",
  "NSTextField",
  "NSSecureTextField",
  "NSText",
  "NSTextView",
  "NSPopUpButton",
  "NSMenu",
  "NSMenuItem",
  "NSScrollView",
  "NSTabView",
  "NSTabViewItem",
  "NSView",
  "NSColor",
  "NSFont",
  "NSAlert",
  "NSImage",
  "NSStatusItem",
  "NSStatusBarButton"
]}
# The window list and the display list. Both crates are already compiled as
# dependencies of objc2-app-kit; naming them here declares what we call
# directly rather than pulling anything new in. The alternative is hand-written
# `extern "C"` declarations of the same CoreGraphics symbols.
#
# `default-features = false` throughout: these crates default to binding whole
# frameworks, which drags in Metal for a window list.
objc2-core-foundation = {version = "0.3", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFDictionary"
]}
objc2-core-graphics = {version = "0.3", default-features = false, features = [
  "std",
  "objc2",
  "CGDirectDisplay",
  "CGError",
  "CGGeometry",
  "CGWindow",
  # How long since the last input event. A count of seconds, not the events:
  # reading input needs an event tap, and an event tap needs Accessibility.
  "CGEventSource",
  "CGEventTypes"
]}
objc2-foundation = {version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSString",
  "NSUserDefaults",
  "NSValue",
  "NSURL"
]}
