name: Pages

# The published site is an allowlist, not a directory. `docs/` holds research
# notes, agent instructions and pull request screenshots; serving all of it to
# make one page reachable would put every one of those on a crawlable URL. So
# the Assemble step names each file it publishes, and a page nobody added to
# that list is not on the internet.
#
# The unit of that list is a file, or a generator. #289's Character gallery
# needs a few hundred PNGs, too many to name as reviewed lines, so the step
# names `scripts/make-character-gallery.py` and the script decides what ships:
# it copies only the frames a Character Manifest names, only PNGs, only from
# inside their own package. The guarantee moves from a reviewed line in a diff
# to a reviewed script, on purpose (ADR-0011) — and the Verify step below
# still checks the outcome, since everything the allowlist exists to keep off
# a crawlable URL is Markdown.
#
# Source is GitHub Actions rather than a branch, so there is no `gh-pages`
# branch to keep in step with `main` — the deployment is this workflow's
# artifact, built from the commit being deployed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. The Pages token lives on `deploy` alone, because
# `build` now runs pull request code and nothing it does needs to write.
permissions:
  contents: read

jobs:
  # Everything that can fail because of what is in the repository, split out so
  # it runs on a pull request too. Building the site only on a push to `main`
  # meant a manifest, a page or the generator could break the deploy and nobody
  # would find out until it was already on `main`.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # tomllib, which the gallery generator reads the manifests with, is 3.11
      # and later. Pinned rather than taken from the runner image so the build
      # does not change under us when that image does.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Assemble the site
        # Flat: the landing page is the site root and every other page sits
        # beside it, so a link is `/cues.html` rather than a path that has to
        # mirror wherever the file happens to live in the repository. The
        # gallery's art is the one exception, under `_site/characters/`,
        # because a page cannot reference a few hundred frames without a
        # directory to put them in.
        run: |
          mkdir -p _site
          cp docs/design/index.html _site/index.html
          cp docs/design/cues.html  _site/cues.html
          cp docs/design/chat.html  _site/chat.html
          cp docs/design/chat-mockups.html _site/chat-mockups.html
          python3 scripts/make-character-gallery.py --self-check
          python3 scripts/make-character-gallery.py --out _site
          python3 scripts/make-expression-page.py --self-check
          python3 scripts/make-expression-page.py --out _site

      - name: Verify nothing but a page or its art reached _site
        # The generator is trusted to enumerate; this is not trusted to be
        # right. Every file the allowlist exists to keep off a crawlable URL
        # is Markdown, so an extension check catches the failure that matters
        # even if a generator one day walks a directory it should not.
        run: |
          stray=$(find _site -type f ! \( -name '*.html' -o -name '*.css' \
            -o -name '*.js' -o -name '*.png' -o -name '*.svg' \))
          if [ -n "$stray" ]; then
            echo "not publishable, and _site holds it:"
            echo "$stray"
            exit 1
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # Packaging the artifact is part of what a pull request checks: it tars
      # `_site`, and it is the step that would reject something `find` above
      # does not look at, such as a symlink out of the tree.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  # Nothing here reads the repository, so nothing here can be checked early.
  # It is skipped on a pull request, which is also what keeps a fork's run away
  # from the `github-pages` environment.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # Deploying to Pages is an OIDC exchange, so the job mints a token.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time, and never cancel one in flight: a cancelled
    # deploy can leave the site on the half-uploaded artifact. Scoped to this
    # job so a pull request's build never queues behind a deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
