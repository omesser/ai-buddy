name: Default Milestone

# Triage works from the milestone view, so an issue filed without one gets V1.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  milestone:
    if: github.event.issue.milestone == null
    runs-on: ubuntu-latest
    steps:
      # By title, not number: a renumbered milestone would break silently,
      # a missing title fails loudly.
      - name: Put the issue in V1
        run: gh issue edit "$ISSUE" --milestone V1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
