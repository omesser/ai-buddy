name: PR Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # One job, both platforms. The differences between them are tool installation
  # and two hooks that guard themselves on uname — not what gets checked, so
  # they do not warrant separate job definitions.
  #
  # The whole workspace is built and tested on Linux as well as macOS. The shell
  # is a Tauri app, so on Linux it needs GTK and WebKit development headers, but
  # nothing in this repository is macOS-only at the source level: platform.rs
  # carries a non-macOS arm for every decision. A review of this branch found
  # that arm had silently rotted, and nothing caught it because the shell was
  # built on one platform only. This is that gap closed.
  checks:
    strategy:
      # One platform failing should still report the other, since the whole
      # point is telling them apart.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.os }}
          # Save the target directory even when the job goes red. A pull
          # request that fails clippy is exactly the one about to be pushed
          # again, and without this every one of those pushes starts from a
          # cold cache — the slowest run this workflow has.
          cache-on-failure: true

      - name: Install shfmt
        # Resolve the asset with jq rather than a regex over the JSON. POSIX ERE
        # leaves stacked quantifiers undefined, so `.+?` is not lazy: it reads as
        # a greedy `.+` followed by an optional `?` and matches from the first
        # "https://" in the payload to the last "linux_amd64", about 7KB of JSON.
        #
        # The asset comes from uname rather than a hardcoded pair, so a runner
        # changing architecture picks the right binary instead of the wrong one.
        #
        # Authenticated, because unauthenticated api.github.com allows 60 calls
        # an hour per source address and hosted runners share theirs. Strangers
        # spend the budget, the query answers 403 at random, and the job dies.
        # GITHUB_TOKEN reads a public repository's releases and lifts the limit
        # into the thousands.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$(uname -s)_$(uname -m)" in
            Linux_x86_64)  asset=_linux_amd64 ;;
            Linux_aarch64) asset=_linux_arm64 ;;
            Darwin_arm64)  asset=_darwin_arm64 ;;
            Darwin_x86_64) asset=_darwin_amd64 ;;
            *) echo "no shfmt asset known for $(uname -s) $(uname -m)"; exit 1 ;;
          esac
          url=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mvdan/sh/releases/latest \
            | jq -r --arg asset "$asset" \
              '.assets[] | select(.name | endswith($asset)) | .browser_download_url')
          # An empty url here means the query succeeded and matched nothing, so
          # say that rather than leaving curl to complain about a blank argument.
          if [ -z "$url" ]; then
            echo "no shfmt release asset ending in $asset"; exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o shfmt "$url"
          chmod +x shfmt && sudo mv shfmt /usr/local/bin/
          shfmt --version

      - name: Install shellcheck
        # macOS only. Linux gets shellcheck from the apt step below, because two
        # steps calling apt meant two `apt-get update` runs a few seconds apart,
        # and the second one refreshes lists that are already current.
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install the Linux system packages
        # Only Linux needs the Tauri libraries: macOS has WebKit in the system
        # already. Without them the shell crate cannot link, which is why the
        # shell used to be built on macOS alone.
        #
        # Not cached. The download is a fraction of this step — most of it is
        # dpkg unpacking the WebKit headers, which a cache would still have to
        # do, and restoring a /usr tree out from under dpkg trades a reliable
        # install for an unreliable one.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev shellcheck

      - name: Cache the pre-commit hook environments
        # The dominant cost of the step below. pre-commit clones every hook repo
        # and builds a virtualenv per language, three of them here, which is
        # around twenty seconds of the run and most of what the pre-commit step
        # spends on macOS.
        #
        # The key covers everything the environments are built from: the config
        # names the repos, their revisions, and codespell's extra dependency, so
        # editing it rebuilds them. pythonLocation carries the patch version
        # actions/setup-python resolved, and a virtualenv points at the exact
        # interpreter that made it — pinning '3.12' is not enough, because a new
        # patch release lands in a new directory and leaves the cached
        # environments pointing at one that is gone.
        #
        # No restore-keys. A near-miss would restore environments for a config
        # that no longer applies and then save them again forever; a config
        # change is rare enough to pay for in full.
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        # No SKIP list. The hooks that need macOS test uname themselves and exit
        # cleanly elsewhere, printing why — pre-commit has no platform key, and a
        # SKIP list here would hide that from anyone running the hooks locally.
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Core crate reaches no platform binding
        # The property the crate split exists to guarantee.
        #
        # --target all, not the host: a dependency behind
        # [target.'cfg(target_os = "macos")'.dependencies] is invisible to a
        # host-only tree, which is exactly how it would come back.
        run: |
          tree=$(cargo tree -p ai-buddy-core --target all)
          if echo "$tree" | grep -qE '\b(tauri|objc2)'; then
            echo "core reaches a platform binding:"; echo "$tree"; exit 1
          fi

      - name: Tests
        # --doc as well as --all-targets: --all-targets excludes doctests, so a
        # `///` example would otherwise never run anywhere.
        run: |
          cargo test --all-targets
          cargo test --doc

      # Not run in CI: scripts/verify-overlay.sh. It needs a real window server
      # and a logged-in desktop session, which no runner has.
