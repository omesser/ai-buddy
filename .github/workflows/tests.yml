name: PR Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  # Keep an in-flight run when a triage label fires `labeled`.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  # One job, both platforms. The differences between them are tool installation
  # and two hooks that guard themselves on uname — not what gets checked, so
  # they do not warrant separate job definitions.
  #
  # The whole workspace is built and tested on Linux as well as macOS. The shell
  # is a Tauri app, so on Linux it needs GTK and WebKit development headers, but
  # nothing in this repository is macOS-only at the source level: platform.rs
  # carries a non-macOS arm for every decision. A review of this branch found
  # that arm had silently rotted, and nothing caught it because the shell was
  # built on one platform only. This is that gap closed.
  checks:
    strategy:
      # One platform failing should still report the other, since the whole
      # point is telling them apart.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find what this run changed
        id: changed
        # A pull request that edits only Markdown was installing Rust, apt and a
        # cargo cache to run tests nothing in its diff could reach. #54, #63,
        # #67 and #68 each paid for a two-platform build to check prose.
        #
        # `files_ignore` is an allowlist of what is not code, rather than a list
        # of the extensions that are: a file type nobody anticipated counts as
        # code until someone says otherwise. That makes this workflow code too,
        # so a change to the detection cannot switch itself off.
        #
        # Pinned to a commit rather than a tag, which the other actions here are
        # not. This one was compromised in March 2025 (CVE-2025-30066): its tags
        # were repointed at a commit that wrote runner memory, secrets included,
        # into the build log. A tag is a moving target and a commit is not.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        continue-on-error: true
        with:
          files_ignore: |
            **/*.md
            LICENSE

      - name: Decide whether this run touches code
        id: changes
        # One path reaches `code=false`: a pull request where the action ran
        # and every changed file was ignored. Everything else runs in full,
        # because a wasted minute costs far less than a check that quietly
        # stopped running.
        #
        # That covers an action that breaks, since the step above is
        # `continue-on-error` and its outcome is checked here. It also covers
        # workflow_dispatch, which is asked for deliberately, and push to main,
        # where the merged state is what ships and is verified once.
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          OUTCOME: ${{ steps.changed.outcome }}
        run: |
          code=true
          if [ "$OUTCOME" = success ] && [ "$ANY_CHANGED" = false ] &&
            [ "${{ github.event_name }}" = pull_request ]; then
            code=false
          fi
          echo "touches code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        # Node runs the renderer's unit tests and nothing else. The front end is
        # static files Tauri embeds, so no Node is involved in a build.
        #
        # Any Node will do: package.json declares the renderer ESM, so nothing
        # here depends on the module-syntax detection that only newer releases
        # do unflagged. Named anyway, so the dependency is visible rather than
        # inherited from whatever the runner image happens to carry.
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Rust
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo build
        if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.os }}
          # Save the target directory even when the job goes red. A pull
          # request that fails clippy is exactly the one about to be pushed
          # again, and without this every one of those pushes starts from a
          # cold cache — the slowest run this workflow has.
          cache-on-failure: true

      - name: Install shfmt
        # Resolve the asset with jq rather than a regex over the JSON. POSIX ERE
        # leaves stacked quantifiers undefined, so `.+?` is not lazy: it reads as
        # a greedy `.+` followed by an optional `?` and matches from the first
        # "https://" in the payload to the last "linux_amd64", about 7KB of JSON.
        #
        # The asset comes from uname rather than a hardcoded pair, so a runner
        # changing architecture picks the right binary instead of the wrong one.
        #
        # Authenticated, because unauthenticated api.github.com allows 60 calls
        # an hour per source address and hosted runners share theirs. Strangers
        # spend the budget, the query answers 403 at random, and the job dies.
        # GITHUB_TOKEN reads a public repository's releases and lifts the limit
        # into the thousands.
        if: steps.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$(uname -s)_$(uname -m)" in
            Linux_x86_64)  asset=_linux_amd64 ;;
            Linux_aarch64) asset=_linux_arm64 ;;
            Darwin_arm64)  asset=_darwin_arm64 ;;
            Darwin_x86_64) asset=_darwin_amd64 ;;
            *) echo "no shfmt asset known for $(uname -s) $(uname -m)"; exit 1 ;;
          esac
          url=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mvdan/sh/releases/latest \
            | jq -r --arg asset "$asset" \
              '.assets[] | select(.name | endswith($asset)) | .browser_download_url')
          # An empty url here means the query succeeded and matched nothing, so
          # say that rather than leaving curl to complain about a blank argument.
          if [ -z "$url" ]; then
            echo "no shfmt release asset ending in $asset"; exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o shfmt "$url"
          chmod +x shfmt && sudo mv shfmt /usr/local/bin/
          shfmt --version

      - name: Install shellcheck
        # macOS only. Linux gets shellcheck from the apt step below, because two
        # steps calling apt meant two `apt-get update` runs a few seconds apart,
        # and the second one refreshes lists that are already current.
        if: runner.os == 'macOS' && steps.changes.outputs.code == 'true'
        run: brew install shellcheck

      - name: Install the Linux system packages
        # Only Linux needs the Tauri libraries: macOS has WebKit in the system
        # already. Without them the shell crate cannot link, which is why the
        # shell used to be built on macOS alone.
        #
        # Not cached. The download is a fraction of this step — most of it is
        # dpkg unpacking the WebKit headers, which a cache would still have to
        # do, and restoring a /usr tree out from under dpkg trades a reliable
        # install for an unreliable one.
        if: runner.os == 'Linux' && steps.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev shellcheck

      - name: Cache the pre-commit hook environments
        # The dominant cost of the step below. pre-commit clones every hook repo
        # and builds a virtualenv per language, three of them here, which is
        # around twenty seconds of the run and most of what the pre-commit step
        # spends on macOS.
        #
        # The key covers everything the environments are built from: the config
        # names the repos, their revisions, and codespell's extra dependency, so
        # editing it rebuilds them. pythonLocation carries the patch version
        # actions/setup-python resolved, and a virtualenv points at the exact
        # interpreter that made it — pinning '3.12' is not enough, because a new
        # patch release lands in a new directory and leaves the cached
        # environments pointing at one that is gone.
        #
        # No restore-keys. A near-miss would restore environments for a config
        # that no longer applies and then save them again forever; a config
        # change is rare enough to pay for in full.
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        # The one step that runs hooks of every kind, so a docs-only run cannot
        # simply be skipped: the whitespace, encoding, YAML/JSON/TOML and
        # codespell hooks are exactly what such a change needs checking against.
        # SKIP takes only the hooks whose toolchain the steps above just
        # declined to install, so what drops out is what could not have run.
        #
        # Still no SKIP list by platform. The hooks that need macOS test uname
        # themselves and exit cleanly elsewhere, printing why — pre-commit has
        # no platform key, and naming them here would hide that from anyone
        # running the hooks locally.
        env:
          SKIP: ${{ steps.changes.outputs.code == 'false' && 'cargo-fmt,cargo-clippy-core,cargo-clippy-mcp-server,cargo-clippy-shell,shfmt,shellcheck' || '' }}
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Core crate reaches no platform binding
        # The property the crate split exists to guarantee.
        #
        # --target all, not the host: a dependency behind
        # [target.'cfg(target_os = "macos")'.dependencies] is invisible to a
        # host-only tree, which is exactly how it would come back.
        if: steps.changes.outputs.code == 'true'
        run: |
          tree=$(cargo tree -p ai-buddy-core --target all)
          if echo "$tree" | grep -qE '\b(tauri|objc2)'; then
            echo "core reaches a platform binding:"; echo "$tree"; exit 1
          fi

      - name: Rust tests
        # --doc as well as --all-targets: --all-targets excludes doctests, so a
        # `///` example would otherwise never run anywhere.
        if: steps.changes.outputs.code == 'true'
        run: |
          cargo test --all-targets
          cargo test --doc

      - name: Renderer tests
        # A step of its own, so a failure names the language it came from rather
        # than sending the reader into a Rust log to find a JavaScript assertion.
        # It runs here rather than as a pre-commit hook because every hook in
        # this repo is a formatter, a linter or a typecheck, and cargo test is
        # not one of them either.
        #
        # An explicit glob, not `--test tests/`: Node 24 reads a bare directory
        # as a test file and fails with MODULE_NOT_FOUND, where Node 20 recursed
        # into it. Naming the files leaves nothing for a release to reinterpret.
        if: steps.changes.outputs.code == 'true'
        run: node --test tests/*.test.js

      # Not run in CI: scripts/verify-overlay.sh. It needs a real window server
      # and a logged-in desktop session, which no runner has.

  # Own job: Windows cannot run the shfmt/shellcheck/apt path `checks` uses.
  # Clippy always runs — a path gate would miss `not(unix)` arms outside the list.
  # Tests only on the path list below, the `windows` label, or non-PR events.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find what this run changed
        id: changed
        # Same pin as `checks` (CVE-2025-30066).
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        continue-on-error: true
        with:
          files: |
            src-tauri/src/platform.rs
            src-tauri/src/platform/windows/**
            crates/core/src/sensing.rs
            src-tauri/Cargo.toml
            crates/core/Cargo.toml
            Cargo.toml
            Cargo.lock
            .github/workflows/tests.yml

      - name: Decide whether this run should test
        id: gate
        # Fail open if changed-files errors. `windows` label forces tests on.
        shell: pwsh
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          OUTCOME: ${{ steps.changed.outcome }}
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          $run_tests = $true
          if ($env:OUTCOME -eq "success" -and $env:ANY_CHANGED -eq "false" -and `
              $env:EVENT -eq "pull_request" -and -not ($env:LABELS -like '*windows*')) {
            $run_tests = $false
          }
          Write-Host "run tests: $run_tests"
          "run_tests=$run_tests" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-latest
          # Same reason as the `checks` job above.
          cache-on-failure: true

      - name: Clippy the workspace for Windows
        # --all-targets: also type-check test modules where many `not(unix)` arms live.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        # --doc: --all-targets skips doctests.
        if: steps.gate.outputs.run_tests == 'true'
        run: |
          cargo test --workspace --all-targets
          cargo test --workspace --doc
