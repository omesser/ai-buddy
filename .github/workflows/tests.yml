name: PR Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Split by capability, not by language: `checks` runs everything that works
  # without a macOS toolchain, `macos` runs the rest.
  checks:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install shfmt
        # Pinned, like rust-toolchain.toml: a formatter that updates itself can
        # reformat the whole repo and fail an unrelated pull request. Keep this
        # in step with what contributors run locally.
        #
        # Resolved by direct URL rather than by grepping the releases API. The
        # obvious one-liner uses `grep -E "https://.+?linux_amd64"`, but ERE has
        # no lazy quantifier, so `.+?` is greedy and swallows enough JSON to
        # hand curl a URL containing braces.
        env:
          SHFMT_VERSION: v3.13.1
        run: |
          curl -fsSL -o shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x shfmt && sudo mv shfmt /usr/bin/
          shfmt --version

      - name: Install shellcheck
        run: sudo apt update && sudo apt install -y shellcheck

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run pre-commit
        env:
          # Two hooks cannot run here, and the `macos` job runs exactly these
          # two. Keep the lists in step.
          #   cargo-clippy      compiles the whole workspace, and the shell half
          #                     needs the macOS windowing stack
          #   swiftc-typecheck  swiftc ships with Xcode
          # Everything else, cargo fmt included, is platform-independent and
          # runs here once.
          SKIP: cargo-clippy,swiftc-typecheck
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Core crate builds and passes with no platform binding
        # The point of the split, checked rather than trusted: if a platform
        # dependency reaches the core, this job fails on Linux where it cannot
        # possibly compile.
        run: |
          # --target all, not the host: a dependency behind
          # [target.'cfg(target_os = "macos")'.dependencies] is invisible to a
          # host-only tree on Linux, which is exactly how it would come back.
          tree=$(cargo tree -p ai-buddy-core --target all)
          if echo "$tree" | grep -qE '\b(tauri|objc2)'; then
            echo "core reaches a platform binding:"; echo "$tree"; exit 1
          fi
          cargo clippy -p ai-buddy-core --all-targets -- -D warnings
          cargo test -p ai-buddy-core

  macos:
    timeout-minutes: 30
    # What the `checks` job could not do. The shell is AppKit and Tauri needs a
    # system webview, so the whole workspace only compiles here; see docs/SPEC.md
    # on Windows being stubbed for v1.
    runs-on: macos-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The two hooks the `checks` job skips, run from the same
      # .pre-commit-config.yaml rather than restated here. Repeating the commands
      # in this file would let CI and the hook config drift apart silently, and
      # the hook config is what contributors run locally.
      - name: Hooks that need macOS
        run: |
          pip install pre-commit
          pre-commit run cargo-clippy --all-files --show-diff-on-failure
          pre-commit run swiftc-typecheck --all-files --show-diff-on-failure

      # Not a hook: the suite is too slow to sit in front of every commit.
      - name: Tests
        run: cargo test --all-targets

      # Not run in CI: scripts/verify-overlay.sh. It needs a real window server
      # and a logged-in desktop session, which a runner does not have.
