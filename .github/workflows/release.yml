name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two runners, two installers. macOS is the real overlay; Linux supports
  # window Perches on X11, degraded Spatial Layer on Wayland. Windows is
  # stubbed in v1 (SPEC) and is not a bundle target, so it has no row.
  #
  # Trigger is a version tag, not every push to main: a Release is a
  # published artifact, and tests.yml already gates the merge. Draft so a
  # human publishes — the first drop is unsigned-by-Apple (ad-hoc only)
  # and should not go live by the act of pushing a tag.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-latest
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: The tag and the app version agree
        # Artifact filenames come from tauri.conf.json, the release name from the
        # tag. Nothing reconciles them, so a tag that ran ahead of the version
        # ships ai-buddy_0.1.0_*.dmg inside a release called v0.2.0.
        if: github.event_name == 'push'
        run: |
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "v$conf" = "${{ github.ref_name }}" ] || {
            echo "tag ${{ github.ref_name }} != tauri.conf.json $conf"; exit 1; }

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-${{ matrix.os }}
          cache-on-failure: true

      - name: Install the Linux system packages
        # Same set tests.yml uses to link the shell. patchelf is what the
        # AppImage bundler patches with; skip it and the Linux job dies
        # after compiling. Not cached: unpacking WebKit headers dominates.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev

      - name: Set up Node
        # tauri-action installs @tauri-apps/cli through npm. The app itself
        # has no Node build step (frontendDist is static files under src/).
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Build and attach packages (tag push)
        # projectPath is src-tauri so the action uses this app's
        # tauri.conf.json rather than walking the repo and guessing.
        # --bundles keeps each OS on the installer that OS can produce;
        # the conf lists all three so a local `tauri build` matches CI.
        #
        # No updater signing key: updater signatures are #200, and
        # createUpdaterArtifacts is false until that key exists. No Apple
        # certificate: signingIdentity "-" in tauri.conf.json is ad-hoc
        # (#132's signed-enough first drop; notarization is a follow-up).
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: ai-buddy ${{ github.ref_name }}
          releaseBody: |
            See the README for install notes.

            Under Wayland the Spatial Layer is degraded: screen-edge physics, 
            no window Perches. Under X11 the overlay reads window geometry and
            Perches work.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Build packages (workflow_dispatch)
        # Same build but no GitHub Release creation - artifacts go to
        # workflow artifacts for testing the packaging path.
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          uploadArtifacts: true
          args: --bundles ${{ matrix.bundles }}
