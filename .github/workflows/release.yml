name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  # Two runners, two installers. macOS is the real overlay; Linux supports
  # window Perches on X11, degraded Spatial Layer on Wayland. Windows is
  # stubbed in v1 (SPEC) and is not a bundle target, so it has no row.
  #
  # The human cuts the Release in GitHub's UI (which creates the tag).
  # This job attaches the installers to that Release; it does not create
  # one. tests.yml already gated the merge.
  #
  # A manual run builds the same bundles and leaves them on the run as
  # workflow artifacts, so the packaging path can be exercised without
  # cutting a Release nobody wanted.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-latest
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Version from the git tag
        # The published Release's tag is the version that ships. Stripping
        # the leading v hands that to Tauri so artifact names follow the
        # tag, not the copy of version sitting in tauri.conf.json.
        #
        # A manual run has no tag, so it keeps that copy. Overriding with a
        # placeholder would only put a version nobody chose on a bundle.
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            echo "args=--config '{\"version\":\"${TAG#v}\"}'" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-${{ matrix.os }}
          cache-on-failure: true

      - name: Install the Linux system packages
        # Same set tests.yml uses to link the shell. patchelf is what the
        # AppImage bundler patches with; skip it and the Linux job dies
        # after compiling. Not cached: unpacking WebKit headers dominates.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev

      - name: Set up Node
        # tauri-action installs @tauri-apps/cli through npm. The app itself
        # has no Node build step (frontendDist is static files under src/).
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Build and attach packages
        # projectPath is src-tauri so the action uses this app's
        # tauri.conf.json rather than walking the repo and guessing.
        # --bundles keeps each OS on the installer that OS can produce;
        # the conf lists all three so a local `tauri build` matches CI.
        #
        # releaseId attaches to the Release the human already published.
        # Both release inputs are empty on a manual run, which is how the
        # action is told to build and upload nothing — the bundles land as
        # workflow artifacts instead, independent of the release config.
        #
        # No updater signing key: updater signatures are #200, and
        # createUpdaterArtifacts is false until that key exists. No Apple
        # certificate: signingIdentity "-" in tauri.conf.json is ad-hoc
        # (#132's signed-enough first drop; notarization is a follow-up).
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: --bundles ${{ matrix.bundles }} ${{ steps.ver.outputs.args }}
