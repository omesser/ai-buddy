# The split docs/SPEC.md describes: a core crate that depends on no platform
# binding, and a shell that does. `cargo tree -p ai-buddy-core` is the check.

[workspace]
resolver = "2"
members = ["crates/core", "crates/mcp-server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88 is what `agent-client-protocol` 2.x and its schema crate declare; the
# shell's ACP client is built on them (ADR-0017). Nothing else here asked for
# more than 1.77.
rust-version = "1.88"
license = "MIT"
