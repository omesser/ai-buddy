---
# Comment blocks stay at or under 20 lines, what the tree passes today; tightening
# is its own pull request. A `//` or `#` run is sibling nodes and ast-grep has no
# repetition operator, so the `line-N` rungs are written out.
id: comment-block-ceiling-rust
language: rust
severity: error
message: Comment block over 20 lines. Compact it, per docs/agents/comments.md.
utils:
  line-1: {kind: line_comment, not: {regex: '^//!'}}
  line-2: {matches: line-1, follows: {matches: line-1, stopBy: neighbor}}
  line-3: {matches: line-1, follows: {matches: line-2, stopBy: neighbor}}
  line-4: {matches: line-1, follows: {matches: line-3, stopBy: neighbor}}
  line-5: {matches: line-1, follows: {matches: line-4, stopBy: neighbor}}
  line-6: {matches: line-1, follows: {matches: line-5, stopBy: neighbor}}
  line-7: {matches: line-1, follows: {matches: line-6, stopBy: neighbor}}
  line-8: {matches: line-1, follows: {matches: line-7, stopBy: neighbor}}
  line-9: {matches: line-1, follows: {matches: line-8, stopBy: neighbor}}
  line-10: {matches: line-1, follows: {matches: line-9, stopBy: neighbor}}
  line-11: {matches: line-1, follows: {matches: line-10, stopBy: neighbor}}
  line-12: {matches: line-1, follows: {matches: line-11, stopBy: neighbor}}
  line-13: {matches: line-1, follows: {matches: line-12, stopBy: neighbor}}
  line-14: {matches: line-1, follows: {matches: line-13, stopBy: neighbor}}
  line-15: {matches: line-1, follows: {matches: line-14, stopBy: neighbor}}
  line-16: {matches: line-1, follows: {matches: line-15, stopBy: neighbor}}
  line-17: {matches: line-1, follows: {matches: line-16, stopBy: neighbor}}
  line-18: {matches: line-1, follows: {matches: line-17, stopBy: neighbor}}
  line-19: {matches: line-1, follows: {matches: line-18, stopBy: neighbor}}
  line-20: {matches: line-1, follows: {matches: line-19, stopBy: neighbor}}
  line-21: {matches: line-1, follows: {matches: line-20, stopBy: neighbor}}
rule:
  any:
    - {kind: block_comment, regex: '(?s)(\n[^\n]*){20}'}
    - {matches: line-21}
---
